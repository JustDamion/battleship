<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>

  <body>
    <section>
      <div class="placement">
        <div class="placement__board board" id="placement-board"></div>
      </div>

      <button class="place-button" id="place-button">Place</button>
      <button class="play-button" id="play-button">Play</button>
    </section>

    <section id="game" class="game">
      <div class="player">
        <div class="player-one" id="player-one">
          <div class="player-one__board board" id="player-one-board"></div>
        </div>
      </div>

      <div class="player">
        <div class="player-two" id="player-two">
          <div class="player-two__board board" id="player-two-board"></div>
        </div>
      </div>
    </section>
  </body>
</html>
